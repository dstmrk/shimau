[package]
name = "shimau"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "A tiny, modern Docker Compose manager"
license = "MIT"
repository = "https://github.com/dstmrk/shimau"
publish = false

[lib]
name = "shimau"
path = "src/lib.rs"

[[bin]]
name = "shimau"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "signal", "sync", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
argon2 = "0.6"
getrandom = "0.4"
sha2 = "0.11"
base64 = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
futures-util = "0.3"
async-stream = "0.3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"
