# Vulnerabilities accepted in the shipped image, with the reason and a date.
#
# Empty is the goal state; the entries below are the exception and each one
# carries an expiry. The list is for findings in the
# third-party Go binaries shimau bundles — the Docker CLI and the Compose
# plugin — that cannot be fixed from this repository because only Docker can
# rebuild and publish them.
#
# Before adding an entry, check whether a newer pin already fixes it. That is
# not a formality: every entry this file has ever held was removed by a version
# bump rather than by expiring, and the twelve that lived here until v1.0.0
# survived mostly because nothing was watching the pins. Dependabot's docker
# ecosystem tracks base images, not apt package pins, so a newer docker-ce-cli
# or docker-compose-plugin can sit published and unnoticed for weeks.
#
#   # what is published for both architectures — they must match, or an
#   # exact-version pin fails the arm64 build
#   for arch in amd64 arm64; do
#     curl -fsSL "https://download.docker.com/linux/debian/dists/trixie/stable/binary-$arch/Packages.gz" \
#       | gunzip | grep -E '^(Package|Version):' | paste - - \
#       | grep -E 'docker-ce-cli|docker-compose-plugin' | tail -4
#   done
#
#   # what a candidate binary actually vendors, read from the binary rather
#   # than from release notes
#   strings docker-compose | grep -oE '(golang\.org|google\.golang\.org)/[a-z/]+@v[0-9][0-9a-zA-Z.-]*' | sort -u
#   strings docker            | grep -oE '^go1\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -1
#
# Compare that against the advisory's fixed version. Bumping the pin removes
# the vulnerable code; a suppression only argues it is unreachable, and the
# argument has to be re-read by a human every time the date lapses.
#
# When an entry is genuinely unavoidable, scope it to the binary it was found
# in, say why shimau is not exposed, and give it an `expired_at`. A CVE that
# later appears anywhere else in the image still fails the build, which is the
# point: this is an exception list, not a switched-off gate.
#
#   vulnerabilities:
#     - id: CVE-0000-00000 # what it is
#       paths: ["usr/libexec/docker/cli-plugins/docker-compose"]
#       statement: Why shimau cannot reach this code path.
#       expired_at: 2026-12-01
#
# The scan prints suppressed rows (`TRIVY_SHOW_SUPPRESSED` in
# `.github/workflows/ci.yml`), so anything accepted here stays visible in the
# job log instead of disappearing.

vulnerabilities:
  # Docker Compose 5.6.0 is the newest published plugin and is still built
  # with go1.26.8 and golang.org/x/net v0.58.0; the fixes are Go 1.26.9 and
  # x/net 0.60.0. The CLI (29.9.0) is already on go1.26.9, so nothing else is
  # accepted. Remove this entry when a Compose release built with Go >= 1.26.9
  # is published and the pin moves to it.
  - id: CVE-2026-78667 # net/http: DoS via crafted HTTP Range headers
    paths: ["usr/libexec/docker/cli-plugins/docker-compose"]
    statement: >-
      Server-side net/http behaviour, judged from the advisory title and not
      traced through Compose's code. Compose runs as a short-lived child of
      shimau for one named operation and listens on no port; it only talks to
      the Docker socket and to registries.
    expired_at: 2026-11-13
  - id: CVE-2026-78669 # net/http, x/net/http2: DoS via excessive HTTP/2 SETTINGS
    paths: ["usr/libexec/docker/cli-plugins/docker-compose"]
    statement: >-
      Same exposure as CVE-2026-78667: Compose serves no HTTP/2 and lives for
      the duration of one operation. Also reported against golang.org/x/net
      v0.58.0 in the same binary; this entry covers both rows.
    expired_at: 2026-11-13
  - id: CVE-2026-97031 # crypto/tls: DoS via multiple ECH outer extension references
    paths: ["usr/libexec/docker/cli-plugins/docker-compose"]
    statement: >-
      TLS handshake parsing reached by an attacker-supplied ClientHello or
      server hello. Compose accepts no inbound TLS; its outbound connections go
      to the registries the operator's own Compose files name.
    expired_at: 2026-11-13
