name: Scheduled Security Audit

on:
  schedule:
    # Mondays at 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      # audit-ci reads package-lock.json and queries the registry, so it needs
      # no node_modules. Pinned, like every action in this repo.
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npx --yes audit-ci@7.1.0 --config ../audit-ci.json

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.21.2
      - name: Audit backend dependencies
        working-directory: backend
        run: cargo audit --deny warnings
